<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DT-INVENTARIS | Karang Taruna Dusun Timur</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body data-bs-theme="dark">
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-icon"><i class="bi bi-trophy-fill"></i></span>
          <div>
            <strong>DT-INVENTARIS</strong
            ><small>KARANG TARUNA DUSUN TIMUR</small>
          </div>
        </div>
        <div class="nav-label">MENU UTAMA</div>
        <nav id="nav" class="d-grid gap-1">
          <button class="nav-link active" data-page="dashboard">
            <i class="bi bi-grid-1x2"></i> Dashboard</button
          ><button class="nav-link" data-page="items">
            <i class="bi bi-box-seam"></i> Inventaris</button
          ><button class="nav-link" data-page="loans">
            <i class="bi bi-arrow-left-right"></i> Peminjaman</button
          ><button class="nav-link" data-page="history">
            <i class="bi bi-clock-history"></i> Riwayat</button
          ><button class="nav-link" data-page="reports">
            <i class="bi bi-file-earmark-bar-graph"></i> Laporan</button
          ><button class="nav-link" data-page="settings">
            <i class="bi bi-gear"></i> Pengaturan
          </button>
        </nav>
        <div class="sidebar-bottom">
          <div class="small opacity-75">⚽ Kelola perlengkapan dengan rapi</div>
          <div class="small mt-1 opacity-50">Front-End • LocalStorage</div>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <button
            class="btn btn-outline-secondary d-lg-none"
            id="menuBtn"
            aria-label="Buka menu"
          >
            <i class="bi bi-list"></i>
          </button>
          <div>
            <div class="eyebrow">FOOTBALL EQUIPMENT MANAGEMENT</div>
            <h1 id="pageTitle">Dashboard</h1>
          </div>
          <div class="d-flex align-items-center gap-2">
            <span class="badge text-bg-success d-none d-sm-inline"
              >● Sistem Lokal</span
            ><button
              class="btn btn-outline-secondary"
              id="themeBtn"
              title="Ganti tema"
            >
              <i class="bi bi-moon-stars"></i>
            </button>
          </div>
        </header>
        <div id="content"></div>
        <footer>
          © <span id="year"> </span> ILYAS TAUFIQUR RAHMAN | DT-INVENTARIS •
          Karang Taruna Dusun Timur
        </footer>
      </main>
    </div>
    <div class="modal fade" id="formModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Form</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <form id="dataForm">
            <div class="modal-body" id="formFields"></div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-outline-secondary"
                data-bs-dismiss="modal"
              >
                Batal</button
              ><button class="btn btn-success" type="submit">Simpan</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div
      id="toastHost"
      class="toast-container position-fixed bottom-0 end-0 p-3"
    ></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
